<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso seguro | StellaPay POS</title>
    <meta name="description" content="Continúa al acceso seguro del aplicativo StellaPay POS." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <link rel="stylesheet" href="../assets/css/login.css" />
  </head>

  <body class="min-h-screen font-sans text-spGray900">
    <main class="min-h-screen grid place-items-center px-5">
      <section class="w-full max-w-md rounded-2xl border border-spGray200 bg-white p-7 shadow-panel text-center">
        <a href="https://stellapaypos.com" class="inline-block text-2xl font-extrabold text-spPrimary tracking-tight">StellaPay</a>
        <p class="mt-3 text-spGray500">
          Por seguridad, el correo y la contraseña se escriben únicamente dentro del aplicativo StellaPay.
        </p>

        <a
          href="https://app.stellapaypos.com/login"
          class="block w-full mt-7 rounded-lg bg-spSuccess text-white font-bold px-4 py-3 hover:opacity-95 transition"
        >
          Continuar a inicio de sesión
        </a>

        <a
          href="https://app.stellapaypos.com/login/registro"
          class="block w-full mt-3 rounded-lg border border-spGray300 bg-white text-spPrimary font-bold px-4 py-3 hover:bg-spGray100 transition"
        >
          Crear un negocio de prueba
        </a>

        <p class="mt-5 text-sm text-spGray500">Verifica que la dirección comience con <strong>https://app.stellapaypos.com</strong> antes de escribir tus datos.</p>
        <a href="https://stellapaypos.com" class="inline-block mt-5 text-sm text-spGray500 hover:text-spGray900">Volver a la página principal</a>
      </section>
    </main>
  </body>
</html>
